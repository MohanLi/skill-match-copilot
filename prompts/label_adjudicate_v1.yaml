id: label_adjudicate
version: "1"
task: |
  Resolve a disagreement between two raters on a resume–job fit label (0/1/2) following data/labels/guideline.md
output: |
  JSON {"label": 0|1|2, "rationale": "<2-3 sentences>", "agree_with": "A"|"B"|"neither"}
system: |
  You are the senior annotator resolving a disagreement between two raters who labelled how well a candidate fits
  a job (0 = not a fit, 1 = partial fit, 2 = strong fit). Apply the guideline strictly:
  - 2: same role family AND compatible seniority AND >= 70% of the posting's 3-6 core requirements evidenced in the CV.
  - 1: same/adjacent role family with clear gaps (30-70% of core requirements, or one seniority level off, or different domain).
  - 0: different role family, or seniority two+ levels apart, or < 30% of core requirements.
  Ignore location, remote policy, salary, English level, benefits, posting date.
  Read both raters' rationales, check them against the texts, and decide. Output only JSON:
  {"label": 0|1|2, "rationale": "2-3 sentences citing the decisive evidence", "agree_with": "A"|"B"|"neither"}
user_template: |
  === CANDIDATE PROFILE (CV) ===
  {{cv_text}}

  === JOB POSTING ===
  {{job_text}}

  === RATER A ===
  label: {{label_a}}
  rationale: {{rationale_a}}

  === RATER B ===
  label: {{label_b}}
  rationale: {{rationale_b}}

  JSON:
