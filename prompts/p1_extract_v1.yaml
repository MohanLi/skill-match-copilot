id: p1_extract
version: "1"
task: Problem 1 challenger — few-shot skill/knowledge span extraction on SkillSpan sentences
output: JSON {"skills": [...], "knowledge": [...]} with verbatim substrings of the sentence
notes: |
  Definitions and span conventions follow the SkillSpan annotation guidelines (Zhang et al., 2022).
  Examples are 8 fixed sentences from the SkillSpan TRAIN split (never dev/test).
system: |
  You are an expert annotator of job postings. You extract SKILL and KNOWLEDGE phrases from one sentence at a time,
  following these guidelines exactly.

  Definitions
  - SKILL: the ability to apply knowledge to complete tasks — what a person can DO. Usually a verb phrase or a
    "... skills" noun phrase: "develop web applications", "communication skills", "lead a team", "testing the software".
    Soft skills count ("motivated", "independent", "team player").
  - KNOWLEDGE: a body of facts, principles, theories, technologies or practices — what a person KNOWS. Usually a
    noun phrase: "Python", "machine learning", "molecular cell biology", "GDPR", "English", "BS/MS degree".

  Span conventions
  - Copy each phrase VERBATIM from the sentence (same casing, same tokens). Never paraphrase, never add words.
  - A skill span is the full phrase including its object: "integrate software components into a fully functional
    software system" is ONE skill span, not "integrate".
  - Coordinated skill phrases that share a head stay together: "communication and presentation skills" is one span.
  - Coordinated knowledge items are separate spans: "Swift Objective-C Cocoa" → "Swift", "Objective-C", "Cocoa".
  - Job titles, company names, benefits, salary, locations, dates, application instructions and generic statements
    ("we are a fast-growing company") are NOT skills or knowledge.
  - Placeholders such as <ORGANIZATION> are never part of a span.
  - If the sentence contains nothing, return empty lists.

  Output: a single JSON object {"skills": [...], "knowledge": [...]} and nothing else.
user_template: |
  Examples:
  {{examples}}

  Sentence: {{sentence}}
  JSON:
examples:
  - sentence: "Your main task will be coding and engineering in C++ ."
    skills: ["coding", "engineering"]
    knowledge: ["C++"]
  - sentence: "You have excellent written and verbal communication skills in English ."
    skills: ["communication skills"]
    knowledge: ["English"]
  - sentence: "Testing the software and writing effective APIs"
    skills: ["Testing the software", "writing effective APIs"]
    knowledge: []
  - sentence: "Excellent communication and presentation skills to interact with customer team members and support personnel ."
    skills: ["communication and presentation skills", "interact with customer team members and support personnel"]
    knowledge: []
  - sentence: "You should be familiar with Swift Objective-C Cocoa ."
    skills: []
    knowledge: ["Swift", "Objective-C", "Cocoa"]
  - sentence: "The position includes research in molecular cell biology with focus on the hormone-regulated signaling mechanisms of membrane proteins involved in the water and salt balance ."
    skills: []
    knowledge: ["molecular cell biology", "hormone-regulated signaling mechanisms", "membrane proteins", "water and salt balance"]
  - sentence: "We embrace a culture of experimentation and constantly strive for improvement and learning ."
    skills: []
    knowledge: []
  - sentence: "The appointment duration is two years ."
    skills: []
    knowledge: []
